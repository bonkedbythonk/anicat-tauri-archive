# Anicat keybinds. Two groups, one rule each:
#   Ctrl+<number>  -> persisted settings (the Settings page shows the same
#                     three, and a change either way reaches the other)
#   Shift+<letter> -> one-shot playback actions. mpv normalizes
#                     Shift+<letter> to the capital letter itself (see mpv's
#                     "Key names" docs), so the line reading "R" below is the
#                     Shift+R binding, not a bare unshifted r.
#
# Everything here is a script-message. Anicat's server is attached to this
# mpv over its IPC pipe and receives each one as a client-message; the two
# that act inside the player (skip, sideways) are handled by anicat.lua.

# --- Settings ---
ctrl+1 script-message anicat-toggle-shaders
ctrl+2 script-message anicat-toggle-autoskip
ctrl+4 script-message anicat-toggle-auto-next

# --- Actions ---
# Shift+S is intentionally absent: anicat.lua force-binds it
# (mp.add_forced_key_binding), which is what stops a viewer's own input.conf
# shadowing the key the skip prompt names. A line here would be a dead
# duplicate of that binding.
R script-message anicat-reload-episode
N script-message anicat-next-episode
P script-message anicat-previous-episode
T script-message anicat-toggle-translation
V script-message anicat-toggle-sideways
