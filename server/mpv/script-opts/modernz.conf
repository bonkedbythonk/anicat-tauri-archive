# Samillion/ModernZ Config - Anicat "Ink & Index" Theme
# Matches the desktop app's default skin (web/src/index.css): warm sumi-ink
# background, washi-paper text, one muted aizome-indigo accent. Chrome stays
# near-monochrome on purpose — the poster/video carries the color, not the OSC.

# --- Core Settings ---
language=default
layout=default
icon_theme=material
icon_style=outline
font=Outfit
idlescreen=no
window_top_bar=no
showwindowed=yes
showfullscreen=yes

# --- Elements Display ---
show_title=yes
title=${media-title}
title_font_size=20
chapter_title_font_size=14
show_chapter_title=yes
timecurrent=yes
time_format=dynamic
time_font_size=14
tooltip_font_size=13
speed_font_size=13

# --- Subtitles and Margins ---
sub_margins=yes
osd_margins=no
dynamic_margins=yes

# --- Playback Buttons & Controls ---
subtitles_button=yes
audio_tracks_button=yes
jump_buttons=yes
jump_amount=10
track_nextprev_buttons=yes
buttons_always_active=playlist_prev,playlist_next
volume_control=yes
volume_control_type=linear
playlist_button=yes
fullscreen_button=yes
info_button=yes
ontop_button=yes
screenshot_button=no
download_button=no
loop_button=yes
shuffle_button=no
speed_button=yes

# Anicat-specific controls (skip intro/outro, Anime4K upscale, autoskip, sub/dub) —
# these mirror the Ctrl+1/Ctrl+2/Shift+S/Alt+D shortcuts already handled in
# anicat_ui/main.lua, wired via the same script-message names below.
anicat_skip_button=yes
anicat_upscale_button=yes
anicat_autoskip_button=yes
anicat_subdub_button=yes

# --- Custom Action Overrides ---
# Map Next and Previous track buttons in the OSC to Anicat backend commands
playlist_next_mbtn_left_command=script-message anicat-next-episode
playlist_prev_mbtn_left_command=script-message anicat-previous-episode

# --- Aesthetic Styling and Colors ---
# Color format: #RRGGBB (Standard Hex)
# Lifted directly from the app's :root tokens in web/src/index.css
osc_color=#161310
title_color=#ede7dc
window_title_color=#ede7dc
window_controls_color=#ede7dc
time_color=#ede7dc
chapter_title_color=#cfc7b8
seekbarfg_color=#8fb8dc
seekbarbg_color=#2a251e
seek_handle_color=#8fb8dc
seek_handle_border_color=#ede7dc
side_buttons_color=#ede7dc
middle_buttons_color=#ede7dc
playpause_color=#ede7dc
hover_effect_color=#8fb8dc

# --- Hover Interactions ---
# Color-only feedback, no scale/glow — matches the app's own near-monochrome
# chrome instead of a bouncy game-UI hover.
deadzonesize=0.0
hidetimeout=500
fadeduration=200
hover_effect=color
button_hover_size=100
button_held_size=100
button_glow_amount=0
slider_hover_size=100
tooltip_hints=yes

# --- Progress Bar Details ---
seek_handle_size=0.75
seekbar_height=medium
seekrange=yes
seekrangealpha=160
slider_rounded_corners=yes
nibbles_style=gap
nibbles_top=yes
nibbles_bottom=yes
persistent_progress=no
